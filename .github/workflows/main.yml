name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Build project
      run: npm run build

    - name: Checkout avinasheditz repository
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/checkout@v4
      with:
        repository: ${{ github.actor }}/avinasheditz
        token: ${{ secrets.GITHUB_TOKEN }}
        path: ./avinasheditz

    - name: Deploy built files
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        if [ -d "avinasheditz" ]; then
          cp -r dist/* avinasheditz/ 2>/dev/null || true
          cd avinasheditz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy: ${{ github.sha }}" || echo "No changes to commit"
          git push
        else
          echo "avinasheditz repository not found"
        fi           
