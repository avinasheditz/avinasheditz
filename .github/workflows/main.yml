name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Build project
      run: npm run build

    - name: Deploy to avinasheditz
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/checkout@v4
      with:
        repository: ${{ github.actor }}/avinasheditz
        token: ${{ secrets.GITHUB_TOKEN }}
        path: deploy

    - name: Push built files
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        cp -r dist/* deploy/
        cd deploy
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Deploy from main: ${{ github.sha }}" || true
        git push           
